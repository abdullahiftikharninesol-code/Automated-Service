services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: missed_lead_rescue
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d missed_lead_rescue"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
